name: aginex

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aginex
      POSTGRES_USER: aginex
      POSTGRES_PASSWORD: aginex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aginex -d aginex"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles: ["postgres"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aginex
      MYSQL_USER: aginex
      MYSQL_PASSWORD: aginex
      MYSQL_ROOT_PASSWORD: aginex-root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uaginex", "-paginex"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["mysql"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aginex
      MINIO_ROOT_PASSWORD: aginex-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    profiles: ["storage"]

